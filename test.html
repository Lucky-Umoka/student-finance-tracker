<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Validator tests</title>
</head>
<body>
  <main>
    <h1>Validator tests</h1>
    <p id="summary" role="status"></p>
    <ul id="results"></ul>
  </main>

  <script type="module">
    import {
      validateDescription, validateAmount, validateDate,
      validateCategory, validateRecord,
    } from "./scripts/validators.js";
    import { compileRegex, filterRecords } from "./scripts/search.js";
    import { sortRecords, normalizeSettings } from "./scripts/state.js";
    import { computeStats, capStatus } from "./scripts/stats.js";
    import { validateCap } from "./scripts/validators.js";
    import { parseImport } from "./scripts/data.js";
    import { validateRate, validateCategories } from "./scripts/validators.js";



    const list = document.getElementById("results");
    let passed = 0;
    let failed = 0;

    // assert(name, actual, expected): one tiny test. It prints PASS or FAIL.
    function assert(name, actual, expected) {
      const pass = Object.is(actual, expected);
      pass ? passed++ : failed++;
      const li = document.createElement("li");
      li.textContent = `${pass ? "PASS" : "FAIL"}: ${name}`;
      li.style.color = pass ? "#166534" : "#b91c1c";
      list.append(li);
    }

    // Description
    assert("description ok", validateDescription("Lunch at cafeteria").ok, true);
    assert("description leading space", validateDescription(" Lunch").ok, false);
    assert("description trailing space", validateDescription("Lunch ").ok, false);
    assert("description empty", validateDescription("").ok, false);
    assert("description duplicate word", validateDescription("Coffee coffee run").ok, false);
    assert("description collapses double spaces", validateDescription("Bus  pass").value, "Bus pass");

    // Amount
    assert("amount 12.50", validateAmount("12.50").ok, true);
    assert("amount 0", validateAmount("0").ok, true);
    assert("amount leading zero", validateAmount("012").ok, false);
    assert("amount 3 decimals", validateAmount("1.234").ok, false);
    assert("amount negative", validateAmount("-5").ok, false);
    assert("amount .5", validateAmount(".5").ok, false);
    assert("amount becomes a number", validateAmount("12.50").value, 12.5);

    // Date
    assert("date ok", validateDate("2025-09-29").ok, true);
    assert("date bad month", validateDate("2025-13-01").ok, false);
    assert("date fake day", validateDate("2025-02-30").ok, false);
    assert("date leap day", validateDate("2024-02-29").ok, true);
    assert("date wrong order", validateDate("29-09-2025").ok, false);

    // Category
    assert("category Food", validateCategory("Food").ok, true);
    assert("category with hyphen", validateCategory("Fast-food").ok, true);
    assert("category with number", validateCategory("Food2").ok, false);
    assert("category double hyphen", validateCategory("Fast--food").ok, false);

    // Whole record
    const good = validateRecord({ description: "Bus pass", amount: "45", category: "Transport", date: "2025-09-20" });
    assert("record valid", good.ok, true);
    const bad = validateRecord({ description: "", amount: "x", category: "1", date: "nope" });
    assert("record collects 4 errors", Object.keys(bad.errors).length, 4);


        // Search and sort
    const sample = [
      { id: "txn_0001", description: "Coffee with friends", amount: 8.75, category: "Entertainment", date: "2025-09-28" },
      { id: "txn_0002", description: "Bus pass", amount: 45, category: "Transport", date: "2025-09-20" },
      { id: "txn_0003", description: "Chemistry textbook", amount: 89.99, category: "Books", date: "2025-09-23" },
    ];

    assert("regex: valid pattern has no error", compileRegex("coffee|tea").error, null);
    assert("regex: broken pattern does not crash", compileRegex("(").regex, null);
    assert("regex: broken pattern gives message", typeof compileRegex("(").error, "string");
    assert("regex: empty box gives no regex", compileRegex("").regex, null);
    assert("search ignores case", filterRecords(sample, compileRegex("COFFEE").regex).length, 1);
    assert("search can be case-sensitive", filterRecords(sample, compileRegex("COFFEE", false).regex).length, 0);
    assert("search finds by date pattern", filterRecords(sample, compileRegex("^2025-09-2[0-3]$").regex).length, 2);
    assert("sort amount high to low", sortRecords(sample, "amount-desc")[0].id, "txn_0003");
    assert("sort date oldest first", sortRecords(sample, "date-asc")[0].id, "txn_0002");
    assert("sort description A to Z", sortRecords(sample, "description-asc")[0].description, "Bus pass");
    assert("sort does not change original", sample[0].id, "txn_0001");

    const today = new Date(2026, 9, 14); 
    const statSample = [
      { amount: 8.75, category: "Entertainment", date: "2026-10-14" },
      { amount: 45, category: "Transport", date: "2026-10-10" },
      { amount: 89.99, category: "Books", date: "2026-10-01" },
      { amount: 0.1, category: "Books", date: "2026-10-14" },
    ];
    const stats = computeStats(statSample, today);
    assert("stats count", stats.count, 4);
    assert("stats sum is rounded", stats.sum, 143.84);
    assert("stats top category", stats.top.name, "Books");
    assert("stats last 7 days total", stats.weekTotal, 53.85);
    assert("stats trend has 7 days", stats.trend.length, 7);
    assert("stats trend last day", stats.trend[6].total, 8.85);
    assert("stats no records", computeStats([], today).top, null);
    assert("cap none", capStatus(10, 0, "USD").state, "none");
    assert("cap under", capStatus(100, 200, "USD").state, "under");
    assert("cap exactly reached is still under", capStatus(200, 200, "USD").state, "under");
    assert("cap over", capStatus(250.5, 200, "USD").state, "over");
    assert("cap validator accepts 0", validateCap("0").ok, true);
    assert("cap validator rejects negative", validateCap("-1").ok, false);
    assert("broken settings fall back to defaults", normalizeSettings({ cap: -5 }).cap, 200);

    
    const row = { id: "txn_1", description: "Bus", amount: 5, category: "Food", date: "2025-01-01" };
    const importOne = (patch) => parseImport(JSON.stringify([{ ...row, ...patch }]));
    assert("import good record", importOne({}).ok, true);
    assert("import not JSON", parseImport("{oops").ok, false);
    assert("import wrong shape", parseImport('{"a":1}').ok, false);
    assert("import empty list", parseImport("[]").ok, false);
    assert("import amount as text", importOne({ amount: "5" }).ok, false);
    assert("import amount 3 decimals", importOne({ amount: 1.234 }).ok, false);
    assert("import fake date", importOne({ date: "2025-02-30" }).ok, false);
    assert("import duplicate word", importOne({ description: "the the" }).ok, false);
    assert("import missing id", importOne({ id: undefined }).ok, false);
    assert("import duplicate ids", parseImport(JSON.stringify([row, row])).ok, false);
    assert("import settings object", parseImport(JSON.stringify({ records: [row], settings: { cap: 50 } })).settings.cap, 50);

   
    assert("rate ok", validateRate("0.0007").ok, true);
    assert("rate zero", validateRate("0").ok, false);
    assert("rate 7 decimals", validateRate("0.0000001").ok, false);
    assert("categories ok", validateCategories("Food, Books ,Fast-food").value.length, 3);
    assert("categories repeated", validateCategories("Food, food").ok, false);
    assert("categories with number", validateCategories("Food, B00ks").ok, false);
    assert("categories empty", validateCategories(" , ").ok, false);

   
    let seed = { ok: false, records: [] };
    try {
      seed = parseImport(await (await fetch("./seed.json")).text());
    } catch {}
    assert("seed.json passes import validation", seed.ok, true);
    assert("seed.json has 10 or more records", seed.records.length >= 10, true);

    document.getElementById("summary").textContent = `${passed} passed, ${failed} failed`;
  </script>
</body>
</html>
