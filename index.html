<!DOCTYPE html>
<html lang= "en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Track student spending, set a budget cap and search with regex.">
    <meta name="theme-color" content="#1d4ed8">
    <title>Student Finance Tracker</title>
    <link rel="icon" href="style/main.css">
    <script type="module" src="script/main.js"></script>
</head>
<body>
    <a class="skip-link" href="#main"> Skip to the main content</a>


    <header class="site-header">
        <h1> Student Finance Tracker</h1>
        <nav aria-label="Main navigation">
            <ul class="nav-list">
                <li><a href="#dashboard">Dashboard</a></li>
                <li><a href="#form-section">Add / Edit</a></li>
                <li><a href="#records">Records</a></li>
                <li><a href="#settings">Settings</a></li>
                <li><a href="#about">About</a></li>
            </ul>
        </nav>
    </header>

    <main id="main" tabindex="-1">

        <section id="dashboard" aria-labelledby="dashboard-title">
            <h2 id="dashboard-title">Dashboard</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total records</h3>
                    <p id="stat-count" class="stat-value">0</p>
                </div>
                <div class="stat-card">
                    <h3>Total spent</h3>
                    <p id="stat-sum" class="stat-value">0</p>
                </div>
                <div class="stat-card">
                    <h3>Top category</h3>
                    <p id="stat-top" class="stat-value">None</p>
                </div>
                <div class="stat-card">
                    <h3>Last 7 days</h3>
                    <p id="stat-week" class="stat-value">0</p>
                </div>
            </div>

            <h3>Spending trend (last 7 days)</h3>
            <div id="trend-chart" class="trend" role="img" aria-label="Spending chart for the last 7 days"></div>

            <h3>Budget cap</h3>
            <p id="cap-status" role="status" aria-live="polite"></p>
            <p id="cap-alert" role="alert" aria-live="assertive"></p>
        </section>

        
    </main>
</body>
